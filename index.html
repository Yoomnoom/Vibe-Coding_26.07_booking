<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>O O 베이킹 클래스 예약 관리 서비스</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff8f1;
      color: #2f241d;
      font-family: Arial, "맑은 고딕", sans-serif;
      line-height: 1.6;
    }

    header,
    main {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 24px 16px;
    }

    header {
      padding-top: 48px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      font-size: 2rem;
      line-height: 1.25;
    }

    section {
      margin-bottom: 32px;
    }

    article,
    form {
      margin-top: 12px;
      padding: 18px;
      border: 1px solid #ead8c4;
      border-radius: 8px;
      background: #ffffff;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
    }

    input,
    textarea,
    button {
      width: 100%;
      min-height: 48px;
      font: inherit;
      border-radius: 8px;
    }

    input,
    textarea {
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid #cdb9a4;
      background: #fffdf9;
    }

    textarea {
      resize: vertical;
    }

    button {
      border: 0;
      background: #c46a2b;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:focus,
    input:focus,
    textarea:focus {
      outline: 3px solid #f0b86c;
      outline-offset: 2px;
    }

    #form-message {
      margin-top: 12px;
      font-weight: 700;
    }

    @media (min-width: 640px) {
      h1 {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>주말에 만나는 달콤한 원데이 베이킹 클래스</h1>
    <p>처음이어도 괜찮은, 따뜻한 주말 베이킹 시간을 예약해보세요.</p>
  </header>

  <main>
    <section aria-labelledby="intro-title">
      <h2 id="intro-title">클래스 소개</h2>

      <article>
        <h3>무엇을 배우나요?</h3>
        <p>주말 하루 동안 직접 만들고 맛보는 원데이 베이킹 클래스입니다.</p>
      </article>

      <article>
        <h3>가격은 얼마인가요?</h3>
        <p>클래스 가격은 예약 문의 후 안내드립니다.</p>
      </article>

      <article>
        <h3>어디에서 하나요?</h3>
        <p>클래스 위치는 예약 확정 시 자세히 안내드립니다.</p>
      </article>
    </section>

    <section aria-labelledby="reservation-title">
      <h2 id="reservation-title">예약 문의</h2>

      <form id="reservation-form">
        <div>
          <label for="name">이름</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div>
          <label for="phone">연락처</label>
          <input type="tel" id="phone" name="phone" required>
        </div>

        <div>
          <label for="preferred-date">희망 날짜</label>
          <input type="date" id="preferred-date" name="preferred-date" required>
        </div>

        <div>
          <label for="request">요청사항</label>
          <textarea id="request" name="request" rows="5"></textarea>
        </div>

        <button type="submit">접수하기</button>
        <p id="form-message" role="status"></p>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Supabase 연결 정보는 여기에서 설정합니다.
    const supabaseUrl = "https://pkucszwwnwpzvzqczmhh.supabase.co";
    const supabaseAnonKey = "sb_publishable_ipfRTlcNU5mwSkgqcAKjmg_i8H0pM94";
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

    const form = document.querySelector("#reservation-form");
    const message = document.querySelector("#form-message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!form.checkValidity()) {
        message.textContent = "빈 칸을 모두 채워주세요.";
        form.reportValidity();
        return;
      }

      const { error } = await supabaseClient.from("reservations").insert({
        name: form.name.value,
        contact: form.phone.value,
        hope_date: form["preferred-date"].value,
        request: form.request.value
      });

      if (error) {
        message.textContent = `접수 실패: ${error.message}`;
        return;
      }

      message.textContent = "접수되었습니다.";
      form.reset();
    });
  </script>
</body>
</html>
